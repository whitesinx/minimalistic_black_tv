<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181b"/><stop offset=".55" stop-color="#0b0c0e"/><stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <pattern id="carbon" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#000" fill-opacity="0"/>
      <rect width="8" height="8" fill="#ffffff" fill-opacity=".022"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff" fill-opacity=".022"/>
      <rect width="8" height="2" fill="#000" fill-opacity=".25"/>
      <rect x="8" y="8" width="2" height="8" fill="#000" fill-opacity=".25"/>
    </pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ced3" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c9ced3" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#eef1f3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8d949a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tealglow" cx=".82" cy=".18" r=".55">
      <stop offset="0" stop-color="#00a19c" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#00a19c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00a19c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27f4d2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#27f4d2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00a19c" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#carbon)"/>
  <rect width="1920" height="1080" fill="url(#tealglow)"/>
  <!-- silver bodywork sweep -->
  <path d="M760 0 L1920 0 L1920 520 C1640 380 1260 210 760 0 Z" fill="url(#silver)"/>
  <path d="M1020 0 L1920 0 L1920 330 C1700 240 1400 120 1020 0 Z" fill="url(#silver)" opacity=".7"/>
  <!-- Petronas teal speed lines -->
  <g transform="rotate(-14 960 540)">
    <rect x="620" y="420" width="1500" height="10" fill="url(#teal)" filter="url(#blur)" opacity=".7"/>
    <rect x="620" y="423" width="1500" height="3" fill="url(#teal)"/>
    <rect x="900" y="470" width="1200" height="2" fill="url(#teal)" opacity=".55"/>
  </g>
  <rect width="1920" height="1080" fill="url(#shade)"/>
</svg>
